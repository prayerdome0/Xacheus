<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b12" />
    <meta
      name="description"
      content="Xacheus — Zambia's short vertical video platform. Real videos, real auth, free sounds, strict security. No fake videos, no copyrighted YouTube tracks. Built for creators, businesses, churches and communities."
    />
    <title>Xacheus — Short Video Platform</title>

    <!-- Favicons. The SVG mark is two-tone, so serve the light-ink build to
         browsers reporting a dark UI and the navy build otherwise. -->
    <link
      rel="icon"
      href="assets/icon.svg"
      type="image/svg+xml"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="assets/icon-dark.svg"
      type="image/svg+xml"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="alternate icon" href="assets/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
    <link rel="mask-icon" href="assets/icon.svg" color="#0546e0" />

    <link rel="manifest" href="manifest.json" />

    <!-- iOS standalone / install metadata -->
    <meta name="application-name" content="Xacheus" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Xacheus" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Xacheus" />
    <meta property="og:title" content="Xacheus — Short Video Platform" />
    <meta
      property="og:description"
      content="Zambia's short vertical video community — real videos, free sounds, churches, opportunities. Built for creators."
    />
    <meta property="og:image" content="assets/brand-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Xacheus — Short Video Platform" />
    <meta name="twitter:image" content="assets/brand-card.png" />
    <meta name="twitter:image:alt" content="Xacheus — Create • Watch • Connect" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />

    <script>
      /**
       * Brand plate, applied before first paint.
       *
       * The logo's plate colour is decided by measuring the logo artwork
       * (js/brand.js). That measurement is cached, and this pre-paint read of
       * the cache is what stops the logo from rendering on the wrong background
       * for a frame. If there is no cache yet, js/brand.js measures the file and
       * corrects the attribute — this script never has to know the answer.
       */
      (function () {
        try {
          var raw = localStorage.getItem("xacheus.brand.plate.v1");
          var cached = raw ? JSON.parse(raw) : null;
          var plate = cached && cached.plate === "dark" ? "dark" : "light";
          document.documentElement.dataset.logoPlate = plate;
          if (cached && cached.accent) document.documentElement.style.setProperty("--logo-accent", cached.accent);
        } catch (err) {
          document.documentElement.dataset.logoPlate = "light";
        }
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>

    <div id="boot" class="boot">
      <div class="boot-inner">
        <span class="logo-plate logo-plate--mark logo-plate--lg" data-brand-slot="mark">
          <img class="logo-ink logo-ink--dark" src="assets/icon.svg" alt="" width="512" height="512" />
          <img class="logo-ink logo-ink--light" src="assets/icon-dark.svg" alt="" width="512" height="512" aria-hidden="true" />
          <span class="sr-only">Xacheus</span>
        </span>
        <p>Loading Xacheus…</p>
        <span class="spinner"></span>
      </div>
    </div>

    <div id="app" hidden></div>

    <div id="auth-overlay" class="auth-overlay" hidden></div>

    <noscript>
      <div class="noscript">
        <h1>JavaScript is required</h1>
        <p>Xacheus Social is a real-time app — please enable JavaScript to continue.</p>
      </div>
    </noscript>

    <script>
      /**
       * Boot watchdog.
       *
       * The app is a module graph: if any module throws while it is being
       * evaluated (bad import, blocked CDN, syntax error) nothing ever runs and
       * the boot spinner spins forever with no explanation. This watches for
       * that and swaps the spinner for a real, actionable error instead.
       */
      (function () {
        var BOOT_TIMEOUT_MS = 12000;
        var reported = false;

        function bootScreen() {
          return document.getElementById("boot");
        }

        function failure(message, detail) {
          var screen = bootScreen();
          if (reported || !screen || screen.hidden || screen.dataset.failed === "1") return;
          reported = true;
          screen.dataset.failed = "1";
          screen.classList.remove("is-done");
          screen.hidden = false;
          screen.innerHTML =
            '<div class="boot-inner">' +
            '<span class="logo-plate logo-plate--mark logo-plate--lg">' +
            '<img class="logo-ink logo-ink--dark" src="assets/icon.svg" alt="" width="512" height="512" />' +
            '<img class="logo-ink logo-ink--light" src="assets/icon-dark.svg" alt="" width="512" height="512" aria-hidden="true" />' +
            "</span>" +
            "<h2>Xacheus could not start</h2>" +
            '<p class="boot-error">' +
            String(message).replace(/[<>&]/g, "") +
            "</p>" +
            (detail ? '<pre class="boot-detail"></pre>' : "") +
            '<div class="boot-actions">' +
            '<button type="button" class="btn btn-primary btn-sm" data-boot="reload">Reload</button>' +
            '<button type="button" class="btn btn-ghost btn-sm" data-boot="dismiss">Continue anyway</button>' +
            "</div>" +
            '<p class="boot-hint">If this keeps happening, check your connection, ad-blocker or VPN — ' +
            "Xacheus loads Firebase from googleapis.com.</p>" +
            "</div>";
          if (detail) {
            var pre = screen.querySelector(".boot-detail");
            if (pre) pre.textContent = String(detail).slice(0, 400);
          }
          screen.querySelectorAll("[data-boot]").forEach(function (button) {
            button.addEventListener("click", function () {
              if (button.dataset.boot === "reload") location.reload();
              else screen.hidden = true;
            });
          });
        }

        // Any uncaught error while the app is still booting is fatal to boot.
        window.addEventListener(
          "error",
          function (event) {
            if (document.getElementById("boot")?.hidden) return;
            var where = event.filename ? event.filename.replace(location.origin, "") : "";
            failure(
              event.message || "A script failed to load.",
              where ? where + (event.lineno ? ":" + event.lineno : "") : ""
            );
          },
          true
        );

        // Failed module/script fetches surface as the resource erroring.
        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (!target || target === window) return;
            if (target.tagName === "SCRIPT" || target.tagName === "LINK") {
              failure("Failed to load " + (target.src || target.href || "a required file") + ".");
            }
          },
          true
        );

        setTimeout(function () {
          var screen = bootScreen();
          if (reported || !screen || screen.hidden || screen.dataset.failed === "1") return;
          failure("Loading is taking longer than expected. The server may be unreachable.");
        }, BOOT_TIMEOUT_MS);
      })();
    </script>

    <!-- Service worker registration, install prompt and update flow all live
         in js/pwa.js, wired up from js/app.js. -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
