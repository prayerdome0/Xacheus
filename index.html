<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3d3a" />

    <title>Seedwel Hub — Buy. Sell. Manage. Grow.</title>
    <meta
      name="description"
      content="Seedwel Hub is the AI-powered business platform for modern businesses. Start, operate, sell, manage, document, market and grow your business from one account: online store, marketplace, inventory, quotations, invoices, receipts, payments, POS and AI insights. A product of Seedwel Investment Limited."
    />
    <meta name="keywords" content="marketplace, business platform, online store, inventory, invoicing, POS, Zambia, wholesale, Seedwel Hub" />
    <meta name="author" content="Seedwel Investment Limited" />
    <link rel="canonical" href="https://seedwelhub.com/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Seedwel Hub" />
    <meta property="og:title" content="Seedwel Hub — Buy. Sell. Manage. Grow." />
    <meta property="og:description" content="Everything your business needs, in one place. Your store, your customers, your documents, your inventory, your growth." />
    <meta property="og:image" content="/brand/logo-1024.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Seedwel Hub — Buy. Sell. Manage. Grow." />
    <meta name="twitter:description" content="The AI-powered business platform for modern businesses." />
    <meta name="twitter:image" content="/brand/logo-1024.png" />

    <!-- Icons & PWA -->
    <link rel="icon" href="/brand/icon.svg" type="image/svg+xml" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/brand/icon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="mask-icon" href="/brand/icon.svg" color="#0f766e" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="application-name" content="Seedwel Hub" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Seedwel Hub" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Seedwel Hub",
        "alternateName": "Seedwel",
        "url": "https://seedwelhub.com/",
        "logo": "https://seedwelhub.com/brand/logo-1024.png",
        "slogan": "Buy. Sell. Manage. Grow.",
        "description": "The AI-powered business platform for modern businesses.",
        "parentOrganization": { "@type": "Organization", "name": "Seedwel Investment Limited" }
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- First-paint shell so the app never shows a white flash on slow networks. -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#071a19;color:#e7f6f4;font-family:Inter,system-ui,sans-serif">
        <img src="/brand/mark-192.png" alt="" width="72" height="72" style="border-radius:18px" />
        <div style="font-weight:800;letter-spacing:.14em;font-size:12px;text-transform:uppercase;opacity:.72">
          Seedwel Hub
        </div>
        <div style="width:132px;height:3px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden">
          <div style="width:40%;height:100%;border-radius:99px;background:#f59e0b;animation:sh-load 1.1s ease-in-out infinite"></div>
        </div>
      </div>
      <style>@keyframes sh-load{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}</style>
    </div>
    <noscript>
      Seedwel Hub needs JavaScript. Please enable it, or contact us on WhatsApp and we will help you sell.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
