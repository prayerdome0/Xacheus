<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b12" />
    <meta
      name="description"
      content="Xacheus Social — share updates, follow people, talk in real time and find your community. Built in Zambia for the world."
    />
    <title>Xacheus — Social</title>

    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icon.svg" />
    <link rel="manifest" href="manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>

    <div id="boot" class="boot">
      <div class="boot-inner">
        <span class="brand-mark boot-mark" aria-hidden="true">X</span>
        <p>Loading Xacheus…</p>
        <span class="spinner"></span>
      </div>
    </div>

    <div id="app" hidden></div>

    <div id="auth-overlay" class="auth-overlay" hidden></div>

    <noscript>
      <div class="noscript">
        <h1>JavaScript is required</h1>
        <p>Xacheus Social is a real-time app — please enable JavaScript to continue.</p>
      </div>
    </noscript>

    <script type="module" src="js/app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
