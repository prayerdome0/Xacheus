<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b12" />
    <meta
      name="description"
      content="Xacheus — Zambia's short vertical video platform. Real videos, real auth, free sounds, strict security. No fake videos, no copyrighted YouTube tracks. Built for creators, businesses, churches and communities."
    />
    <title>Xacheus — Short Video Platform</title>

    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icon.svg" />
    <link rel="manifest" href="manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>

    <div id="boot" class="boot">
      <div class="boot-inner">
        <img class="brand-logo boot-mark" src="assets/icon.svg" alt="Xacheus" width="56" height="56" />
        <p>Loading Xacheus…</p>
        <span class="spinner"></span>
      </div>
    </div>

    <div id="app" hidden></div>

    <div id="auth-overlay" class="auth-overlay" hidden></div>

    <noscript>
      <div class="noscript">
        <h1>JavaScript is required</h1>
        <p>Xacheus Social is a real-time app — please enable JavaScript to continue.</p>
      </div>
    </noscript>

    <script>
      /**
       * Boot watchdog.
       *
       * The app is a module graph: if any module throws while it is being
       * evaluated (bad import, blocked CDN, syntax error) nothing ever runs and
       * the boot spinner spins forever with no explanation. This watches for
       * that and swaps the spinner for a real, actionable error instead.
       */
      (function () {
        var BOOT_TIMEOUT_MS = 12000;
        var reported = false;

        function bootScreen() {
          return document.getElementById("boot");
        }

        function failure(message, detail) {
          var screen = bootScreen();
          if (reported || !screen || screen.hidden || screen.dataset.failed === "1") return;
          reported = true;
          screen.dataset.failed = "1";
          screen.classList.remove("is-done");
          screen.hidden = false;
          screen.innerHTML =
            '<div class="boot-inner">' +
            '<img class="brand-logo boot-mark" src="assets/icon.svg" alt="Xacheus" width="56" height="56" />' +
            "<h2>Xacheus could not start</h2>" +
            '<p class="boot-error">' +
            String(message).replace(/[<>&]/g, "") +
            "</p>" +
            (detail ? '<pre class="boot-detail"></pre>' : "") +
            '<div class="boot-actions">' +
            '<button type="button" class="btn btn-primary btn-sm" data-boot="reload">Reload</button>' +
            '<button type="button" class="btn btn-ghost btn-sm" data-boot="dismiss">Continue anyway</button>' +
            "</div>" +
            '<p class="boot-hint">If this keeps happening, check your connection, ad-blocker or VPN — ' +
            "Xacheus loads Firebase from googleapis.com.</p>" +
            "</div>";
          if (detail) {
            var pre = screen.querySelector(".boot-detail");
            if (pre) pre.textContent = String(detail).slice(0, 400);
          }
          screen.querySelectorAll("[data-boot]").forEach(function (button) {
            button.addEventListener("click", function () {
              if (button.dataset.boot === "reload") location.reload();
              else screen.hidden = true;
            });
          });
        }

        // Any uncaught error while the app is still booting is fatal to boot.
        window.addEventListener(
          "error",
          function (event) {
            if (document.getElementById("boot")?.hidden) return;
            var where = event.filename ? event.filename.replace(location.origin, "") : "";
            failure(
              event.message || "A script failed to load.",
              where ? where + (event.lineno ? ":" + event.lineno : "") : ""
            );
          },
          true
        );

        // Failed module/script fetches surface as the resource erroring.
        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (!target || target === window) return;
            if (target.tagName === "SCRIPT" || target.tagName === "LINK") {
              failure("Failed to load " + (target.src || target.href || "a required file") + ".");
            }
          },
          true
        );

        setTimeout(function () {
          var screen = bootScreen();
          if (reported || !screen || screen.hidden || screen.dataset.failed === "1") return;
          failure("Loading is taking longer than expected. The server may be unreachable.");
        }, BOOT_TIMEOUT_MS);
      })();
    </script>

    <script type="module" src="js/app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
